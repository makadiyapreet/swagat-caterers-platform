{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/images/logo/favicon.png">
    <title>Sign Up - Swagat Caterers</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* LIGHT THEME STYLES */
        body {
            background-color: #f4f6f8;
            color: #333;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-top: 5px solid #D4AF37; /* Gold Accent */
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        /* LOGO STYLE */
        .auth-logo {
            height: 80px; /* Adjust size here */
            width: auto;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: #1a1a1a;
            margin-bottom: 5px;
            margin-top: 0;
            font-size: 26px;
        }

        p { color: #666; font-size: 14px; margin-bottom: 25px; }

        .swagat-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #f9f9f9;
            border: 1px solid #ddd;
            color: #333;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        .swagat-input:focus {
            border-color: #D4AF37;
            background: #fff;
            outline: none;
        }

        .btn-gold {
            background-color: #D4AF37;
            color: #fff;
            padding: 12px;
            width: 100%;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(212, 175, 55, 0.3);
        }

        .btn-gold:hover { background-color: #b59020; }

        .auth-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .auth-link b { color: #D4AF37; }

        .message { margin-top: 15px; font-size: 14px; }
        .success { color: #2e7d32; }
        .error { color: #d32f2f; }

        /* Section 18: Password Strength Bar */
        .strength-container { margin: 5px 0 10px; }
        .strength-bar { height: 4px; border-radius: 2px; background: #eee; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0; }
        .strength-label { font-size: 11px; margin-top: 4px; color: #999; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            
            <img src="{% static 'images/logo/logo.png' %}" alt="Swagat Caterers" class="auth-logo">

            <h2>Create Account</h2>
            <p>Join us to start your custom order</p>
            
            <form id="signup-form">
                <input type="text" id="username" class="swagat-input" placeholder="Username" required>
                <input type="email" id="email" class="swagat-input" placeholder="Email Address" required>
                <input type="tel" id="phone" class="swagat-input" placeholder="Phone Number (e.g. 9876543210)" required>
                
                <input type="password" id="password" class="swagat-input" placeholder="Password" required oninput="checkStrength(this.value)">
                <div class="strength-container">
                    <div class="strength-bar"><div class="strength-fill" id="str-fill"></div></div>
                    <div class="strength-label" id="str-label"></div>
                </div>
                <input type="password" id="confirm_password" class="swagat-input" placeholder="Confirm Password" required>
                
                <button type="submit" class="btn-gold">Sign Up</button>
            </form>
            
            <p id="message" class="message"></p>
            <a href="{% url 'login' %}" class="auth-link">Already have an account? <b>Login Here</b></a>
        </div>
    </div>

    

<script>
    // Section 18: Password Strength Meter
    function checkStrength(password) {
        const fill = document.getElementById('str-fill');
        const label = document.getElementById('str-label');
        let score = 0;
        if (password.length >= 8) score++;
        if (password.length >= 12) score++;
        if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
        if (/[0-9]/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;

        const levels = [
            { width: '0%', color: '#eee', text: '' },
            { width: '20%', color: '#e74c3c', text: 'Very Weak' },
            { width: '40%', color: '#e67e22', text: 'Weak' },
            { width: '60%', color: '#f39c12', text: 'Fair' },
            { width: '80%', color: '#27ae60', text: 'Good' },
            { width: '100%', color: '#2ecc71', text: 'Strong ✓' },
        ];

        const level = levels[Math.min(score, 5)];
        fill.style.width = level.width;
        fill.style.background = level.color;
        label.textContent = level.text;
        label.style.color = level.color;
    }
</script>
<script>
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirm_password').value;
        const messageBox = document.getElementById('message');
        const signupForm = document.getElementById('signup-form'); // Reference to hide form on success

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        if (password !== confirmPass) {
            messageBox.className = "message error";
            messageBox.innerText = "Passwords do not match!";
            return;
        }

        messageBox.innerText = "Creating your account...";
        messageBox.className = "message";

       try {
            const response = await fetch('/auth/users/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ 
                    username: username, 
                    email: email, 
                    password: password,
                    re_password: confirmPass, 
                    phone_number: phone 
                })
            });

            const textBody = await response.text();

            // 1. HANDLE ERRORS
            if (!response.ok) {
                console.error("Server Error Detail:", textBody);
                messageBox.className = "message error";

                try {
                    const errorJson = JSON.parse(textBody);
                    let errorMessages = [];
                    for (const [field, messages] of Object.entries(errorJson)) {
                        errorMessages.push(`${field.replace('_', ' ')}: ${messages.join(' ')}`);
                    }
                    messageBox.innerText = errorMessages.join('\n');
                } catch (e) {
                    // If the backend crashed (500), it implies an SMTP/Server error
                    messageBox.innerText = "Server Error (500). Please contact admin.";
                }
                return;
            }

            // 2. HANDLE SUCCESS -> REDIRECT
            // This replaces all that code changing the innerHTML
            window.location.href = "/registration-pending/";

        } catch (error) {
            console.error("Connection Error:", error);
            messageBox.className = "message error";
            messageBox.innerText = "Network error. Server may be offline.";
        }
    });
</script>
</body>
</html>
