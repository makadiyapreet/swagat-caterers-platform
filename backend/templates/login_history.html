{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/images/logo/favicon.png">
    <title>Login History — Swagat Caterers</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f6f1; min-height: 100vh; color: #333; }
        
        .header { background: linear-gradient(135deg, #1a1a1a, #111); padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #D4AF37; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #D4AF37; }
        .header-sub { color: rgba(255,255,255,0.6); font-size: 0.72rem; margin-top: 2px; }
        .header a { color: #fff; text-decoration: none; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
        .header a:hover { background: rgba(255,255,255,0.2); }

        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .stat-card { background: #fff; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid #f0ece4; }
        .stat-number { font-size: 1.5rem; font-weight: 800; color: #D4AF37; }
        .stat-label { font-size: 0.7rem; color: #999; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px 40px; }
        
        .card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 15px rgba(0,0,0,0.04); border: 1px solid #f0ece4; margin-bottom: 20px; }
        .card h2 { font-family: 'Playfair Display', serif; color: #D4AF37; font-size: 1.2rem; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #f0f0f0; }
        
        .logout-all-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; border: none; padding: 10px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; transition: all 0.3s; margin-bottom: 20px; }
        .logout-all-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(231,76,60,0.3); }
        
        .login-entry { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #f5f5f5; transition: all 0.2s; }
        .login-entry:hover { background: #fafaf8; margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 8px; }
        .login-entry:last-child { border-bottom: none; }
        
        .device-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
        .device-icon.mobile { background: #eaf5ee; }
        .device-icon.desktop { background: #e8f0fe; }
        .device-icon.tablet { background: #fef3e2; }
        
        .login-details { flex: 1; min-width: 0; }
        .login-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
        .login-browser { font-weight: 700; font-size: 0.9rem; color: #1a1a1a; }
        .login-os { font-size: 0.78rem; color: #666; }
        .login-username { background: #D4AF37; color: #fff; padding: 1px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; }
        .login-sub { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.75rem; color: #999; }
        .login-sub code { background: #f5f5f5; padding: 1px 6px; border-radius: 4px; font-size: 0.72rem; }
        
        .login-right { text-align: right; flex-shrink: 0; }
        .login-time { font-size: 0.78rem; font-weight: 600; color: #555; }
        .login-ago { font-size: 0.7rem; color: #999; margin-top: 2px; }
        
        .badge-new { background: #e74c3c; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.68rem; font-weight: 700; }
        .badge-known { background: #27ae60; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.68rem; font-weight: 700; }
        
        .empty { text-align: center; padding: 40px; color: #999; }
        .toast { position: fixed; top: 20px; right: 20px; background: #27ae60; color: #fff; padding: 12px 25px; border-radius: 10px; font-weight: 600; display: none; z-index: 999; box-shadow: 0 4px 20px rgba(39,174,96,0.3); }
        
        @media (max-width: 768px) {
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .header { flex-direction: column; gap: 10px; text-align: center; padding: 12px 15px; }
            .login-entry { flex-direction: column; gap: 8px; }
            .login-right { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast">All other sessions logged out!</div>
    
    <div class="header">
        <div>
            <h1>🔐 Login History</h1>
            <div class="header-sub">Swagat Caterers - Security</div>
        </div>
        <a href="/dashboard/">← Dashboard</a>
    </div>
    
    <div class="stats-bar">
        <div class="stat-card"><div class="stat-number" id="s-total">-</div><div class="stat-label">Total Logins</div></div>
        <div class="stat-card"><div class="stat-number" id="s-new">-</div><div class="stat-label">New IPs</div></div>
        <div class="stat-card"><div class="stat-number" id="s-devices">-</div><div class="stat-label">Unique IPs</div></div>
        <div class="stat-card"><div class="stat-number" id="s-users">-</div><div class="stat-label">Users</div></div>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>Recent Sessions</h2>
            <button class="logout-all-btn" onclick="logoutAll()">🔒 Logout All Other Sessions</button>
            <div id="history-list"><p class="empty">Loading...</p></div>
        </div>
    </div>
    
    <script>
        const TOKEN = localStorage.getItem('authToken');
        if (!TOKEN) window.location.href = '/login/';
        
        function getCookie(name) {
            let v = null;
            if (document.cookie) {
                document.cookie.split(';').forEach(c => {
                    c = c.trim();
                    if (c.startsWith(name + '=')) v = decodeURIComponent(c.substring(name.length + 1));
                });
            }
            return v;
        }
        
        function timeAgo(dateStr) {
            const now = new Date();
            const d = new Date(dateStr);
            const diff = Math.floor((now - d) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
            if (diff < 604800) return `${Math.floor(diff/86400)}d ago`;
            return `${Math.floor(diff/604800)}w ago`;
        }

        function deviceIcon(device) {
            if (device === 'Mobile') return { emoji: '📱', cls: 'mobile' };
            if (device === 'Tablet') return { emoji: '📟', cls: 'tablet' };
            return { emoji: '💻', cls: 'desktop' };
        }
        
        async function loadHistory() {
            try {
                const resp = await fetch('/api/login-history/', {
                    headers: { 'Authorization': `Token ${TOKEN}` }
                });
                const data = await resp.json();
                
                if (data.length === 0) {
                    document.getElementById('history-list').innerHTML = '<p class="empty">No login history found.</p>';
                    return;
                }
                
                // Stats
                document.getElementById('s-total').textContent = data.length;
                document.getElementById('s-new').textContent = data.filter(h => h.is_new_ip).length;
                const uniqueIPs = [...new Set(data.map(h => h.ip))];
                document.getElementById('s-devices').textContent = uniqueIPs.length;
                const uniqueUsers = [...new Set(data.map(h => h.username).filter(Boolean))];
                document.getElementById('s-users').textContent = uniqueUsers.length || 1;
                
                let html = '';
                data.forEach(h => {
                    const date = new Date(h.timestamp);
                    const dateStr = date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
                    const timeStr = date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
                    const location = [h.city, h.country].filter(Boolean).join(', ') || 'Unknown';
                    const badge = h.is_new_ip ? '<span class="badge-new">New IP</span>' : '<span class="badge-known">Known</span>';
                    const ago = timeAgo(h.timestamp);
                    const icon = deviceIcon(h.device || 'Desktop');
                    const userBadge = h.username ? `<span class="login-username">${h.username}</span>` : '';
                    
                    html += `<div class="login-entry">
                        <div class="device-icon ${icon.cls}">${icon.emoji}</div>
                        <div class="login-details">
                            <div class="login-main">
                                <span class="login-browser">${h.browser || 'Unknown'}</span>
                                <span class="login-os">on ${h.os || 'Unknown'}</span>
                                ${badge}
                                ${userBadge}
                            </div>
                            <div class="login-sub">
                                <span>📍 ${location}</span>
                                <span>🌐 <code>${h.ip}</code></span>
                                <span>${h.device || 'Desktop'}</span>
                            </div>
                        </div>
                        <div class="login-right">
                            <div class="login-time">${dateStr}</div>
                            <div class="login-ago">${timeStr} · ${ago}</div>
                        </div>
                    </div>`;
                });
                
                document.getElementById('history-list').innerHTML = html;
            } catch(e) {
                document.getElementById('history-list').innerHTML = '<p class="empty">Could not load history.</p>';
            }
        }
        
        async function logoutAll() {
            if (!confirm('This will log you out of all other devices. Continue?')) return;
            try {
                const resp = await fetch('/api/logout-all/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Token ${TOKEN}`,
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    }
                });
                const data = await resp.json();
                if (data.new_token) {
                    localStorage.setItem('authToken', data.new_token);
                }
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
            } catch(e) {
                alert('Failed to logout other sessions.');
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
