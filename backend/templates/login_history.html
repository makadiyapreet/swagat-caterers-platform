{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/images/logo/favicon.png">
    <title>Login History — Swagat Caterers</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f4f6f8; min-height: 100vh; color: #333; }
        
        .top-bar {
            background: #fff; padding: 15px 30px; border-bottom: 3px solid #D4AF37;
            display: flex; justify-content: space-between; align-items: center;
        }
        .top-bar h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #333; }
        .top-bar a { color: #D4AF37; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .top-bar a:hover { color: #aa8c2c; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        
        .card {
            background: #fff; border-radius: 12px; padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 20px;
        }
        .card h2 {
            font-family: 'Playfair Display', serif; color: #D4AF37;
            font-size: 1.3rem; margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .logout-all-btn {
            background: #e74c3c; color: #fff; border: none; padding: 10px 25px;
            border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
            transition: all 0.3s; margin-bottom: 20px;
        }
        .logout-all-btn:hover { background: #c0392b; transform: translateY(-2px); }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px 12px; font-size: 0.75rem; text-transform: uppercase;
             color: #888; letter-spacing: 0.5px; border-bottom: 2px solid #f0f0f0; }
        td { padding: 12px; border-bottom: 1px solid #f5f5f5; font-size: 0.88rem; }
        tr:hover { background: #fafafa; }
        
        .badge-new { background: #e74c3c; color: #fff; padding: 2px 8px; border-radius: 10px;
                     font-size: 0.7rem; font-weight: 700; }
        .badge-known { background: #27ae60; color: #fff; padding: 2px 8px; border-radius: 10px;
                       font-size: 0.7rem; font-weight: 700; }
        
        .empty { text-align: center; padding: 40px; color: #999; }
        .toast {
            position: fixed; top: 20px; right: 20px; background: #27ae60; color: #fff;
            padding: 12px 25px; border-radius: 10px; font-weight: 600; display: none; z-index: 999;
        }
        
        @media (max-width: 768px) {
            .top-bar { flex-direction: column; gap: 10px; text-align: center; padding: 12px 15px; }
            .top-bar h1 { font-size: 1.3rem; }
            .container { padding: 0 12px; margin: 20px auto; }
            .card { padding: 18px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            table { font-size: 0.78rem; min-width: 500px; }
            td, th { padding: 8px 6px; }
        }
        @media (max-width: 480px) {
            .top-bar h1 { font-size: 1.1rem; }
            .card { padding: 12px; }
            .card h2 { font-size: 1.1rem; }
            .logout-all-btn { width: 100%; font-size: 0.8rem; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast">All other sessions logged out!</div>
    
    <div class="top-bar">
        <h1>🔐 Login History</h1>
        <a href="/profile/">← Back to Profile</a>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>Recent Sessions</h2>
            <button class="logout-all-btn" onclick="logoutAll()">🔒 Logout All Other Sessions</button>
            
            <div id="history-table">
                <p class="empty">Loading...</p>
            </div>
        </div>
    </div>
    
    <script>
        const TOKEN = localStorage.getItem('authToken');
        if (!TOKEN) window.location.href = '/login/';
        
        function getCookie(name) {
            let v = null;
            if (document.cookie) {
                document.cookie.split(';').forEach(c => {
                    c = c.trim();
                    if (c.startsWith(name + '=')) v = decodeURIComponent(c.substring(name.length + 1));
                });
            }
            return v;
        }
        
        async function loadHistory() {
            try {
                const resp = await fetch('/api/login-history/', {
                    headers: { 'Authorization': `Token ${TOKEN}` }
                });
                const data = await resp.json();
                
                if (data.length === 0) {
                    document.getElementById('history-table').innerHTML = '<p class="empty">No login history found.</p>';
                    return;
                }
                
                let html = `<table>
                    <thead><tr>
                        <th>Date & Time</th><th>IP Address</th><th>Location</th><th>Device</th><th>Status</th>
                    </tr></thead><tbody>`;
                
                data.forEach(h => {
                    const date = new Date(h.timestamp).toLocaleString();
                    const location = [h.city, h.country].filter(Boolean).join(', ') || 'Unknown';
                    const badge = h.is_new_ip
                        ? '<span class="badge-new">New IP</span>'
                        : '<span class="badge-known">Known</span>';
                    html += `<tr>
                        <td>${date}</td>
                        <td><code>${h.ip}</code></td>
                        <td>${location}</td>
                        <td style="max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${h.user_agent || 'Unknown'}</td>
                        <td>${badge}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('history-table').innerHTML = html;
            } catch(e) {
                document.getElementById('history-table').innerHTML = '<p class="empty">Could not load history.</p>';
            }
        }
        
        async function logoutAll() {
            if (!confirm('This will log you out of all other devices. Continue?')) return;
            try {
                const resp = await fetch('/api/logout-all/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Token ${TOKEN}`,
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    }
                });
                const data = await resp.json();
                if (data.new_token) {
                    localStorage.setItem('authToken', data.new_token);
                }
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
            } catch(e) {
                alert('Failed to logout other sessions.');
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
