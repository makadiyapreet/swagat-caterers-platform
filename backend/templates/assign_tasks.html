{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Tasks — Swagat Caterers</title>
    <link rel="icon" href="{% static 'images/logo/favicon.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'images/logo/favicon.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#faf9f6; color:#333; min-height:100vh; }

        .nav { background:#fff; padding:14px 30px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 1px 8px rgba(0,0,0,0.06); position:sticky; top:0; z-index:100; border-bottom:1px solid #f0ece4; }
        .nav-brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
        .nav-brand img { height:32px; }
        .nav-brand span { color:#1a1a1a; font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:700; }
        .nav-link { color:#666; text-decoration:none; font-size:0.8rem; padding:7px 16px; border:1px solid #ddd; border-radius:8px; transition:all 0.3s; font-weight:500; }
        .nav-link:hover { background:#f5f5f5; border-color:#bbb; color:#333; }

        .container { max-width:1100px; margin:0 auto; padding:30px 20px; }
        .page-header { margin-bottom:25px; }
        .page-header h1 { font-family:'Playfair Display',serif; font-size:1.7rem; color:#1a1a1a; }
        .page-header p { color:#999; font-size:0.85rem; margin-top:4px; }

        .layout { display:grid; grid-template-columns:380px 1fr; gap:25px; align-items:start; }

        /* Form Card */
        .form-card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 15px rgba(0,0,0,0.05); border:1px solid #f0ece4; position:sticky; top:80px; }
        .form-header { background:linear-gradient(135deg,#1a1a1a,#2c2c2c); padding:18px 25px; }
        .form-header h2 { color:#D4AF37; font-size:1rem; font-weight:700; margin:0; }
        .form-body { padding:25px; }
        .form-group { margin-bottom:16px; }
        .form-label { font-size:0.72rem; color:#888; text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:5px; font-weight:600; }
        .form-input, .form-select, .form-textarea { width:100%; padding:11px 14px; border:1.5px solid #e8e4dc; border-radius:10px; font-size:0.85rem; font-family:'Inter',sans-serif; background:#faf9f6; color:#333; transition:all 0.3s; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:#D4AF37; outline:none; box-shadow:0 0 0 3px rgba(212,175,55,0.1); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .btn-assign { width:100%; padding:13px; background:linear-gradient(135deg,#D4AF37,#c5a028); color:#1a1a1a; border:none; border-radius:12px; font-weight:800; font-size:0.9rem; cursor:pointer; transition:all 0.3s; box-shadow:0 4px 15px rgba(212,175,55,0.25); margin-top:6px; }
        .btn-assign:hover { transform:translateY(-2px); box-shadow:0 6px 25px rgba(212,175,55,0.4); }

        /* Tasks List */
        .tasks-card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 15px rgba(0,0,0,0.05); border:1px solid #f0ece4; }
        .tasks-header { padding:18px 25px; border-bottom:1px solid #f0ece4; display:flex; justify-content:space-between; align-items:center; }
        .tasks-header h2 { font-size:1rem; font-weight:700; color:#1a1a1a; }
        .tasks-count { background:linear-gradient(135deg,#D4AF37,#c5a028); color:#1a1a1a; padding:4px 14px; border-radius:20px; font-size:0.75rem; font-weight:700; }
        .tasks-filters { padding:12px 25px; border-bottom:1px solid #f0ece4; display:flex; gap:6px; flex-wrap:wrap; }
        .filter-btn { padding:5px 14px; border-radius:18px; font-size:0.72rem; font-weight:600; cursor:pointer; transition:all 0.2s; border:1px solid #e8e4dc; background:#fff; color:#666; }
        .filter-btn.active { background:#1a1a1a; color:#D4AF37; border-color:#1a1a1a; }
        .tasks-body { max-height:600px; overflow-y:auto; }

        /* Task Item */
        .task-item { padding:16px 25px; border-bottom:1px solid #f5f3ed; transition:all 0.2s; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
        .task-item:hover { background:#faf8f2; }
        .task-info { flex:1; min-width:0; }
        .task-title { font-weight:700; font-size:0.92rem; color:#1a1a1a; margin-bottom:3px; }
        .task-meta { font-size:0.75rem; color:#999; display:flex; gap:12px; flex-wrap:wrap; margin-top:4px; }
        .task-meta span { display:flex; align-items:center; gap:3px; }
        .task-desc { font-size:0.8rem; color:#777; margin-top:4px; }
        .task-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
        .task-status { font-size:0.7rem; padding:4px 12px; border-radius:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; }
        .status-pending { background:#fef3e2; color:#e67e22; }
        .status-in_progress { background:#e8f4fd; color:#3498db; }
        .status-done { background:#e8f8ef; color:#27ae60; }
        .status-rejected { background:#fde8e8; color:#e74c3c; }
        .task-change { padding:4px 10px; border:1px solid #e8e4dc; border-radius:8px; font-size:0.7rem; background:#fff; color:#666; cursor:pointer; }
        .prio-dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; margin-top:6px; }
        .prio-high { background:#e74c3c; }
        .prio-medium { background:#f39c12; }
        .prio-low { background:#27ae60; }
        .overdue-badge { background:#e74c3c; color:#fff; padding:2px 8px; border-radius:8px; font-size:0.6rem; font-weight:700; }

        .empty { text-align:center; padding:50px 20px; color:#999; }
        .empty h3 { color:#bbb; margin-bottom:6px; }
        .toast { position:fixed; top:20px; right:20px; padding:14px 24px; border-radius:12px; font-weight:700; z-index:9999; display:none; color:#fff; font-size:0.85rem; box-shadow:0 5px 20px rgba(0,0,0,0.15); }

        @media (max-width:850px) { .layout { grid-template-columns:1fr; } .form-card { position:relative; top:0; } }
        @media (max-width:500px) { .form-row { grid-template-columns:1fr; } .container { padding:20px 14px; } }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/dashboard/" class="nav-brand">
            <img src="{% static 'images/logo/logo.png' %}" alt="Swagat">
            <span>Swagat Caterers</span>
        </a>
        <a href="/dashboard/" class="nav-link">← Dashboard</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>📋 Task Management</h1>
            <p>Assign tasks to your team and track their progress</p>
        </div>

        <div class="layout">
            <!-- Left: Create Form -->
            <div class="form-card">
                <div class="form-header"><h2>+ Assign New Task</h2></div>
                <div class="form-body">
                    <form id="task-form">
                        <div class="form-group">
                            <label class="form-label">Assign To</label>
                            <select id="task-assignee" class="form-select" required></select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Priority</label>
                                <select id="task-priority" class="form-select">
                                    <option value="low">🟢 Low</option>
                                    <option value="medium" selected>🟡 Medium</option>
                                    <option value="high">🔴 High</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Deadline</label>
                                <input type="date" id="task-deadline" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Task Title</label>
                            <input type="text" id="task-title" class="form-input" placeholder="e.g. Prepare setup for wedding reception" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description (optional)</label>
                            <textarea id="task-desc" class="form-textarea" rows="3" placeholder="Additional details or instructions..."></textarea>
                        </div>
                        <button type="submit" class="btn-assign">Assign Task →</button>
                    </form>
                </div>
            </div>

            <!-- Right: Tasks List -->
            <div class="tasks-card">
                <div class="tasks-header">
                    <h2>All Tasks</h2>
                    <span class="tasks-count" id="task-count">0 tasks</span>
                </div>
                <div class="tasks-filters">
                    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
                    <button class="filter-btn" onclick="setFilter('pending',this)">⏳ Pending</button>
                    <button class="filter-btn" onclick="setFilter('in_progress',this)">🔄 In Progress</button>
                    <button class="filter-btn" onclick="setFilter('done',this)">✅ Done</button>
                    <button class="filter-btn" onclick="setFilter('rejected',this)">❌ Rejected</button>
                </div>
                <div class="tasks-body" id="tasks-list">
                    <div class="empty"><h3>Loading tasks...</h3></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const token = localStorage.getItem('authToken');
        let allTasks = [];
        let currentFilter = 'all';

        async function init() {
            if (!token) { window.location.href = '/login/'; return; }
            try {
                const uRes = await fetch('/auth/users/me/', { headers: { 'Authorization': `Token ${token}` } });
                const user = await uRes.json();
                if (user.user_type !== 'admin') { window.location.href = '/dashboard/'; return; }
            } catch(e) { window.location.href = '/login/'; return; }

            // Load staff users for dropdown
            try {
                const r = await fetch('/api/staff-users/', { headers: { 'Authorization': `Token ${token}` } });
                if (r.ok) {
                    const users = await r.json();
                    document.getElementById('task-assignee').innerHTML = users.map(u =>
                        `<option value="${u.id}">${u.username} (${u.user_type})</option>`
                    ).join('');
                }
            } catch(e) {}

            // Set default deadline to tomorrow
            const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('task-deadline').value = tomorrow.toISOString().split('T')[0];

            loadTasks();

            document.getElementById('task-form').addEventListener('submit', async (ev) => {
                ev.preventDefault();
                const body = {
                    assigned_to: document.getElementById('task-assignee').value,
                    title: document.getElementById('task-title').value,
                    description: document.getElementById('task-desc').value || '',
                    deadline: document.getElementById('task-deadline').value,
                    priority: document.getElementById('task-priority').value,
                };
                const r = await fetch('/api/tasks/', {
                    method: 'POST',
                    headers: { 'Authorization': `Token ${token}`, 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify(body)
                });
                if (r.ok) {
                    document.getElementById('task-form').reset();
                    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
                    document.getElementById('task-deadline').value = tomorrow.toISOString().split('T')[0];
                    showToast('✅ Task assigned successfully!', '#27ae60');
                    loadTasks();
                } else {
                    showToast('❌ Failed to assign task', '#e74c3c');
                }
            });
        }

        async function loadTasks() {
            try {
                const r = await fetch('/api/tasks/', { headers: { 'Authorization': `Token ${token}` } });
                if (!r.ok) throw new Error();
                allTasks = await r.json();
                renderTasks();
            } catch(e) {
                document.getElementById('tasks-list').innerHTML = '<div class="empty"><h3>Could not load tasks</h3></div>';
            }
        }

        function setFilter(f, btn) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTasks();
        }

        function renderTasks() {
            let tasks = allTasks;
            if (currentFilter !== 'all') tasks = allTasks.filter(t => t.status === currentFilter);
            document.getElementById('task-count').textContent = `${tasks.length} task${tasks.length !== 1 ? 's' : ''}`;

            if (!tasks.length) {
                document.getElementById('tasks-list').innerHTML = `<div class="empty"><h3>No ${currentFilter === 'all' ? '' : currentFilter} tasks</h3><p>Tasks will appear here once assigned</p></div>`;
                return;
            }

            document.getElementById('tasks-list').innerHTML = tasks.map(t => {
                const today = new Date().toISOString().split('T')[0];
                const isOverdue = t.deadline && t.deadline < today && !['done','rejected'].includes(t.status);
                return `
                <div class="task-item">
                    <span class="prio-dot prio-${t.priority}"></span>
                    <div class="task-info">
                        <div class="task-title">${t.title} ${isOverdue ? '<span class="overdue-badge">OVERDUE</span>' : ''}</div>
                        <div class="task-meta">
                            <span>👤 ${t.assigned_to_name || 'Staff'}</span>
                            <span>📅 ${t.deadline || 'No deadline'}</span>
                            <span>⚡ ${t.priority}</span>
                        </div>
                        ${t.description ? `<div class="task-desc">${t.description}</div>` : ''}
                    </div>
                    <div class="task-right">
                        <span class="task-status status-${t.status}">${formatStatus(t.status)}</span>
                        ${!['done','rejected'].includes(t.status) ? `
                        <select class="task-change" onchange="updateStatus(${t.id}, this.value)">
                            <option value="">Change ▾</option>
                            <option value="pending">Pending</option>
                            <option value="in_progress">In Progress</option>
                            <option value="done">Done ✓</option>
                            <option value="rejected">Rejected ✕</option>
                        </select>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function formatStatus(s) {
            return { pending:'Pending', in_progress:'In Progress', done:'Done', rejected:'Rejected' }[s] || s;
        }

        async function updateStatus(taskId, status) {
            if (!status) return;
            try {
                const r = await fetch(`/api/tasks/${taskId}/status/`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Token ${token}`, 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ status })
                });
                if (r.ok) { showToast('✅ Status updated', '#27ae60'); loadTasks(); }
            } catch(e) { showToast('❌ Failed', '#e74c3c'); }
        }

        function showToast(msg, color) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.style.background = color; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function getCookie(name) {
            let v = null;
            document.cookie.split(';').forEach(c => { c = c.trim(); if (c.startsWith(name + '=')) v = c.substring(name.length + 1); });
            return v;
        }

        init();
    </script>
</body>
</html>
