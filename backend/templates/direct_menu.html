{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/images/logo/favicon.png">
    <title>Direct Menu Creator - Swagat Caterers</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Segoe+UI:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --gold: #D4AF37; --dark-gold: #aa8c2c; --bg: #f8f9fa; --text: #2c3e50; }
        body { background: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--text); padding-bottom: 100px; }
        
        /* Font helper for Gujarati */
        .font-guj { font-family: 'Noto Sans Gujarati', sans-serif; }

        /* Navbar */
        .dashboard-nav { background: #fff; padding: 15px 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .brand { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: #000; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-logo { height: 40px; }
        .back-btn { background: #eee; color: #333; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; white-space: nowrap; }
        .back-btn:hover { background: #ddd; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* Header Section */
        .page-header { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid var(--gold); display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; }
        .header-title h1 { margin: 0; font-family: 'Playfair Display', serif; color: var(--dark-gold); font-size: 28px; }
        .header-title p { margin: 5px 0 0; color: #666; font-size: 14px; }
        
        /* Client Inputs */
        .client-inputs { display: flex; gap: 15px; flex-wrap: wrap; width: 100%; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ddd; }
        .input-group { flex: 1; min-width: 200px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: #555; margin-bottom: 5px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .input-group input:focus { border-color: var(--gold); outline: none; }

        /* Content Grid */
        .builder-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }

        /* Menu Accordion */
        .category-card { background: white; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); overflow: hidden; border: 1px solid #f0f0f0; }
        .cat-header { padding: 15px 20px; background: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 16px; transition: 0.2s; }
        .cat-header:hover { background: #fdfdfd; color: var(--dark-gold); }
        .cat-header.active { background: #fffcf5; color: var(--gold); border-bottom: 1px solid #eee; }
        .cat-body { padding: 0 20px; max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #fafafa; }
        .cat-body.open { padding: 20px; max-height: none; border-top: 1px solid #f0f0f0; overflow: visible; }

        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .item-check { display: flex; align-items: flex-start; gap: 10px; padding: 10px; background: white; border: 1px solid #eee; border-radius: 6px; cursor: pointer; transition: 0.2s; min-height: 40px; }
        .item-check:hover { border-color: #ddd; }
        .item-check.checked { background: #fffcf5; border-color: #ffe082; }
        .item-check input { margin-top: 4px; transform: scale(1.2); cursor: pointer; accent-color: var(--gold); flex-shrink: 0; }
        .item-label { font-size: 14px; color: #333; user-select: none; flex: 1; line-height: 1.4; }

        .custom-area { margin-top: 15px; width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; box-sizing: border-box; }
        .custom-area:focus { border-color: var(--gold); outline: none; }
        .custom-area-hint { font-size: 11px; color: #aaa; margin-top: 4px; }

        /* Sidebar / Summary */
        .summary-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); position: sticky; top: 100px; border-top: 4px solid var(--gold); max-height: calc(100vh - 130px); overflow-y: auto; }
        .summary-card h3 { margin-top: 0; font-family: 'Playfair Display', serif; color: #333; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        /* Language Switcher */
        .lang-switch { display: flex; margin-bottom: 20px; background: #f0f0f0; padding: 4px; border-radius: 8px; }
        .lang-opt { flex: 1; text-align: center; padding: 8px; cursor: pointer; border-radius: 6px; font-size: 14px; font-weight: 600; color: #666; transition: 0.3s; }
        .lang-opt.active { background: white; color: var(--dark-gold); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .summary-stats { margin: 15px 0; font-size: 14px; color: #555; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stat-val { font-weight: 700; color: var(--dark-gold); }

        /* ── Selected Items Live Panel ── */
        .selected-panel { margin-top: 15px; border-top: 1px solid #eee; padding-top: 12px; }
        .selected-panel-title { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .selected-panel-title button { background: none; border: none; font-size: 11px; color: #e74c3c; cursor: pointer; font-weight: 600; padding: 0; }
        .selected-panel-title button:hover { text-decoration: underline; }
        .sel-category { margin-bottom: 12px; }
        .sel-cat-name { font-size: 11px; font-weight: 700; color: var(--dark-gold); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; padding: 3px 8px; background: #fffcf5; border-left: 3px solid var(--gold); border-radius: 0 4px 4px 0; }
        .sel-items-list { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 0 0 8px; }
        .sel-chip { background: white; border: 1px solid #e8d9a0; border-radius: 20px; padding: 3px 10px 3px 10px; font-size: 12px; color: #444; display: inline-flex; align-items: center; gap: 5px; transition: 0.15s; }
        .sel-chip:hover { border-color: #e74c3c; background: #fff5f5; }
        .sel-chip button { background: none; border: none; color: #bbb; cursor: pointer; font-size: 14px; padding: 0; line-height: 1; margin-left: 2px; }
        .sel-chip button:hover { color: #e74c3c; }
        .sel-empty { font-size: 13px; color: #bbb; font-style: italic; text-align: center; padding: 14px 0; }
        .sel-chip-custom { background: #f0f9ff; border-color: #b3d9f0; color: #2c7aa0; }
        .sel-chip-custom:hover { border-color: #2c7aa0; background: #e0f2fe; }

        .btn-action { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; text-align: center; gap: 8px; }
        .btn-pdf { background: #2c3e50; color: white; }
        .btn-pdf:hover { background: #34495e; }
        .btn-save { background: var(--gold); color: white; }
        .btn-save:hover { background: #e0c055; }
        .btn-preview { background: white; border: 1px solid #ccc; color: #666; }
        .btn-preview:hover { background: #f9f9f9; color: #333; }

        /* Responsive */
        @media (max-width: 900px) {
            .builder-grid { grid-template-columns: 1fr; }
            .summary-card { position: relative; top: 0; z-index: 10; margin-bottom: 30px; max-height: none; }
            .client-inputs { flex-direction: column; gap: 10px; }
            .page-header { flex-direction: column; align-items: stretch; }
            .nav-logo { height: 35px; }
            .brand { font-size: 20px; }
            .dashboard-nav { padding: 12px 15px; }
        }
        @media (max-width: 768px) {
            .container { padding: 0 10px; margin: 15px auto; }
            .page-header { padding: 18px; }
            .header-title h1 { font-size: 22px; }
            .item-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
            .item-check { padding: 8px; }
            .item-label { font-size: 13px; }
            .summary-card { padding: 18px; }
            .cat-header { padding: 12px 15px; font-size: 15px; }
            .cat-body.open { padding: 15px; }
            .btn-action { padding: 11px; font-size: 13px; }
            .sel-chip { font-size: 11px; padding: 2px 8px; }
        }
        @media (max-width: 480px) {
            .brand { font-size: 17px; gap: 8px; }
            .nav-logo { height: 28px; }
            .back-btn { font-size: 12px; padding: 6px 10px; }
            .page-header { padding: 15px; }
            .header-title h1 { font-size: 20px; }
            .header-title p { font-size: 12px; }
            .item-grid { grid-template-columns: 1fr 1fr; }
            .item-check { padding: 7px; min-height: 36px; }
            .item-label { font-size: 12px; }
            .input-group label { font-size: 11px; }
            .input-group input { padding: 8px; font-size: 13px; }
            .lang-switch { margin-bottom: 12px; }
            .lang-opt { padding: 6px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <nav class="dashboard-nav">
        <a href="{% url 'dashboard' %}" class="brand">
            <img src="{% static 'images/logo/logo.png' %}" class="nav-logo" alt="Logo"> Swagat Admin
        </a>
        <a href="{% url 'dashboard' %}" class="back-btn">← Dashboard</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <div class="header-title" style="flex: 1;">
                <h1 id="page-title">Direct Menu</h1>
                <p id="page-subtitle">Select items to generate a PDF instantly.</p>
            </div>
            
            <div class="client-inputs" id="standalone-inputs" style="display:none;">
                <div class="input-group">
                    <label>Client Name</label>
                    <input type="text" id="client-name" placeholder="Enter Name">
                </div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="event-date">
                </div>
                <div class="input-group">
                    <label>Guests</label>
                    <input type="number" id="guest-count" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Venue</label>
                    <input type="text" id="venue-name" placeholder="Optional">
                </div>
                <div class="input-group">
                    <label>Phone</label>
                    <input type="text" id="client-phone" placeholder="Optional">
                </div>
            </div>

            <div class="client-inputs" id="linked-inputs" style="display:none; background: #fffcf5; border: 1px solid #ffe082; padding: 15px; border-radius: 8px;">
                <div style="font-size: 15px; color: #555; width: 100%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        <strong style="color:#aa8c2c">Booking:</strong> <span id="linked-name" style="font-weight:bold; color:#000;">-</span> | 
                        <span id="linked-date">-</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <label style="font-size:12px; font-weight:bold; color:#555; text-transform:uppercase;">Menu Guests</label>
                        <input type="number" id="linked-guest-count" style="width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" placeholder="0">
                    </div>
                </div>
            </div>
        </div>

        <div class="builder-grid">
            <div id="menu-accordion">
                <div style="text-align:center; padding: 40px; color: #999;">Loading Menu Items...</div>
            </div>

            <div class="summary-wrapper">
                <div class="summary-card">
                    <h3>Menu Controls</h3>
                    
                    <label style="font-size:12px; font-weight:bold; color:#888; display:block; margin-bottom:5px;">VIEW LANGUAGE:</label>
                    <div class="lang-switch">
                        <div class="lang-opt active" id="lang-en" onclick="switchViewLang('en')">English</div>
                        <div class="lang-opt font-guj" id="lang-gu" onclick="switchViewLang('gu')">ગુજરાતી</div>
                    </div>

                    <div class="summary-stats">
                        <div class="stat-row"><span>Categories:</span> <span class="stat-val" id="count-cats">0</span></div>
                        <div class="stat-row"><span>Items:</span> <span class="stat-val" id="count-items">0</span></div>
                    </div>

                    <!-- ── LIVE SELECTED ITEMS PANEL ── -->
                    <div class="selected-panel">
                        <div class="selected-panel-title">
                            <span>Selected Items</span>
                            <button onclick="clearAllItems()" id="clear-all-btn" style="display:none;">Clear All</button>
                        </div>
                        <div id="selected-preview">
                            <div class="sel-empty">No items selected yet</div>
                        </div>
                    </div>
                    
                    <div class="input-group" style="margin-bottom: 20px; margin-top: 18px;">
                        <label>Footer Note</label>
                        <textarea id="menu-note" class="custom-area" rows="3" placeholder="Ex: Jain Food, Spicy..."></textarea>
                    </div>

                    <button class="btn-action btn-pdf" onclick="generatePDF('en', false)">
                        ⬇ Download English PDF
                    </button>
                    <button class="btn-action btn-pdf" onclick="generatePDF('gu', false)" style="background:#856404;">
                        ⬇ Download Gujarati PDF
                    </button>

                    <div style="display:flex; gap:10px;">
                        <button class="btn-action btn-preview" onclick="generatePDF('en', true)">👁 Eng</button>
                        <button class="btn-action btn-preview" onclick="generatePDF('gu', true)">👁 Guj</button>
                    </div>

                    <button id="btn-save-db" class="btn-action btn-save" style="display:none; margin-top:10px;" onclick="saveToDatabase()">
                        💾 Save to Booking
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SETUP & AUTH ---
        const token = localStorage.getItem('authToken');
        if (!token) window.location.href = "{% url 'login' %}";

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event_id');
        const menuId = urlParams.get('menu_id');

        // State
        let categories = [];
        let allItems = [];
        let selectedItems = new Set(); 
        let currentEventData = null;
        let viewLang = 'en';

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function init() {
            try {
                const userRes = await fetch('/auth/users/me/', { 
                    headers: { 
                        'Authorization': `Token ${token}`,
                        'X-CSRFToken': getCookie('csrftoken')
                    } 
                });
                
                if (!userRes.ok) {
                    localStorage.removeItem('authToken');
                    window.location.href = "{% url 'login' %}";
                    return;
                }
                
                const user = await userRes.json();
                const rawType = (user.user_type || '').toLowerCase();
                const isAdminUser = (rawType === 'admin' || user.is_superuser);
                const isManagerUser = (rawType === 'manager');
                window.currentUsername = user.username;
                window.isAdminUser = isAdminUser;
                
                if (!isAdminUser && !isManagerUser) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Access Denied',
                        text: 'Only Admins and Managers can access the Menu Creator.',
                        confirmButtonText: 'Go to Dashboard',
                        confirmButtonColor: '#d4af37',
                        allowOutsideClick: false
                    }).then(() => {
                        window.location.href = '{% url "dashboard" %}';
                    });
                    return; 
                }

                const [catRes, itemRes] = await Promise.all([
                    fetch('/api/menu/categories/', { headers: { 'Authorization': `Token ${token}` } }),
                    fetch('/api/menu/menu-items/', { headers: { 'Authorization': `Token ${token}` } })
                ]);
                categories = await catRes.json();
                allItems = await itemRes.json();

                renderAccordion();

                if (eventId) {
                    setupLinkedMode();
                } else {
                    setupStandaloneMode();
                }
            } catch (e) { 
                console.error(e); 
                Swal.fire("Error", "Failed to load data.", "error"); 
            }
        }

        // --- 2. MODES ---
        async function setupLinkedMode() {
            const linkedDiv = document.getElementById('linked-inputs');
            const saveBtn = document.getElementById('btn-save-db');
            if(linkedDiv) linkedDiv.style.display = 'flex';
            if(saveBtn) saveBtn.style.display = 'flex'; 
            
            try {
                const res = await fetch(`/api/menu/events/${eventId}/`, { 
                    headers: { 'Authorization': `Token ${token}` } 
                });
                currentEventData = await res.json();
                
                document.getElementById('linked-name').innerText = currentEventData.title;
                document.getElementById('linked-date').innerText = formatDate(currentEventData.date);
                // default to 0 if creating a new menu in linked mode
                document.getElementById('linked-guest-count').value = ""; 
                document.getElementById('page-title').innerText = "Manage Menu";
                document.getElementById('page-subtitle').innerText = `Editing menu for: ${currentEventData.title}`;

                if (menuId) { loadExistingMenu(menuId); }
            } catch(e) { console.error(e); }
        }

        function setupStandaloneMode() {
            document.getElementById('standalone-inputs').style.display = 'flex';
            document.getElementById('event-date').valueAsDate = new Date();
        }

        async function loadExistingMenu(mid) {
            try {
                const res = await fetch(`/api/menu/menus/${mid}/`, { 
                    headers: { 'Authorization': `Token ${token}` } 
                });
                const menu = await res.json();
                
                menu.items.forEach(id => {
                    selectedItems.add(parseInt(id));
                });
                
                if (menu.guest_count) document.getElementById('linked-guest-count').value = menu.guest_count;
                if(menu.note) document.getElementById('menu-note').value = menu.note;
                
                // Restore custom items from saved JSON into category textareas
                if (menu.custom_items_text) {
                    try {
                        const customData = JSON.parse(menu.custom_items_text);
                        // customData format: { "catId": ["item1", "item2"], ... }
                        window._pendingCustomItems = customData;
                    } catch(e) { console.log('Could not parse custom_items_text', e); }
                }
                
                renderAccordion();
                
                // After rendering, restore custom textarea values
                if (window._pendingCustomItems) {
                    const customData = window._pendingCustomItems;
                    Object.keys(customData).forEach(catId => {
                        const textarea = document.getElementById(`custom-${catId}`);
                        if (textarea && Array.isArray(customData[catId]) && customData[catId].length > 0) {
                            textarea.value = customData[catId].join('\n');
                        }
                    });
                    delete window._pendingCustomItems;
                }
                
                categories.forEach(cat => {
                    const hasSel = menu.items.some(iId => allItems.find(x => x.id === iId)?.category === cat.id);
                    const hasCustom = document.getElementById(`custom-${cat.id}`)?.value?.trim();
                    if(hasSel || hasCustom) toggleCategory(cat.id, true);
                });
                updateStats();
            } catch(e) { console.error(e); }
        }

        // --- 3. RENDERING & UI ---
        function switchViewLang(lang) {
            viewLang = lang;
            document.getElementById('lang-en').className = `lang-opt ${lang === 'en' ? 'active' : ''}`;
            document.getElementById('lang-gu').className = `lang-opt font-guj ${lang === 'gu' ? 'active' : ''}`;
            renderAccordion();
            updateStats(); // re-render selected panel in new language
        }

        function renderAccordion() {
            const container = document.getElementById('menu-accordion');
            const openCats = Array.from(document.querySelectorAll('.cat-body.open')).map(el => el.id);
            container.innerHTML = '';

            categories.forEach(cat => {
                const catItems = allItems.filter(i => i.category === cat.id);
                if (catItems.length === 0) return;

                const catName = (viewLang === 'gu' && cat.gujarati_name) ? cat.gujarati_name : cat.name;

                let itemsHtml = '';
                catItems.forEach(item => {
                    const isChecked = selectedItems.has(item.id) ? 'checked' : '';
                    const checkedClass = selectedItems.has(item.id) ? 'checked' : '';
                    const itemName = (viewLang === 'gu' && item.gujarati_name) ? item.gujarati_name : item.name;
                    const fontClass = viewLang === 'gu' ? 'font-guj' : '';

                    itemsHtml += `
                        <label class="item-check ${checkedClass}">
                            <input type="checkbox" class="item-checkbox" value="${item.id}" ${isChecked} onchange="toggleItem(${item.id}, this)">
                            <span class="item-label ${fontClass}">${itemName}</span>
                        </label>
                    `;
                });

                const isOpen = openCats.includes(`cat-body-${cat.id}`);
                const openClass = isOpen ? 'open' : '';
                const activeClass = isOpen ? 'active' : '';
                const placeholderText = viewLang === 'gu' 
                    ? 'દરેક લાઈનમાં એક વસ્તુ ઉમેરો...' 
                    : 'One custom item per line...';

                const html = `
                    <div class="category-card">
                        <div class="cat-header ${activeClass}" onclick="toggleCategory(${cat.id})">
                            <span class="${viewLang==='gu'?'font-guj':''}">${catName}</span>
                            <span style="font-size:12px; color:#999;">${catItems.length} items</span>
                        </div>
                        <div class="cat-body ${openClass}" id="cat-body-${cat.id}">
                            <div class="item-grid">${itemsHtml}</div>
                            <textarea class="custom-area" placeholder="${placeholderText}" id="custom-${cat.id}" rows="3" oninput="updateStats()"></textarea>
                            <div class="custom-area-hint">💡 Each line = one item in the PDF</div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function toggleCategory(id, forceOpen = false) {
            const body = document.getElementById(`cat-body-${id}`);
            if(!body) return;
            const header = body.previousElementSibling;
            if (forceOpen) {
                body.classList.add('open');
                header.classList.add('active');
            } else {
                body.classList.toggle('open');
                header.classList.toggle('active');
            }
        }

        function toggleItem(id, checkbox) {
            if (checkbox.checked) {
                selectedItems.add(id);
                checkbox.closest('.item-check').classList.add('checked');
            } else {
                selectedItems.delete(id);
                checkbox.closest('.item-check').classList.remove('checked');
            }
            updateStats();
        }

        // Remove item from outside the accordion (chip × button)
        function removeItem(id) {
            selectedItems.delete(id);
            // Sync checkbox in accordion if visible
            const cb = document.querySelector(`.item-checkbox[value="${id}"]`);
            if (cb) {
                cb.checked = false;
                cb.closest('.item-check').classList.remove('checked');
            }
            updateStats();
        }

        // Clear all selected items
        function clearAllItems() {
            selectedItems.clear();
            // Uncheck all visible checkboxes
            document.querySelectorAll('.item-checkbox').forEach(cb => {
                cb.checked = false;
                cb.closest('.item-check').classList.remove('checked');
            });
            updateStats();
        }

        function updateStats() {
            document.getElementById('count-items').innerText = selectedItems.size;

            // Compute active categories
            const activeCatIds = new Set();
            selectedItems.forEach(iid => {
                const item = allItems.find(x => x.id === iid);
                if(item) activeCatIds.add(item.category);
            });
            document.getElementById('count-cats').innerText = activeCatIds.size;

            const clearBtn = document.getElementById('clear-all-btn');
            const preview = document.getElementById('selected-preview');

            // Build grouped structure: regular checked items + custom lines per category
            let totalVisible = 0;
            let html = '';

            categories.forEach(cat => {
                // Regular checked items for this category
                const checkedItems = allItems.filter(x => selectedItems.has(x.id) && x.category === cat.id);

                // Custom lines from this category's textarea
                const textarea = document.getElementById(`custom-${cat.id}`);
                const customLines = textarea
                    ? textarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0)
                    : [];

                if (checkedItems.length === 0 && customLines.length === 0) return;

                totalVisible += checkedItems.length + customLines.length;

                const catName = (viewLang === 'gu' && cat.gujarati_name) ? cat.gujarati_name : cat.name;
                const fontClass = viewLang === 'gu' ? 'font-guj' : '';

                html += `<div class="sel-category">
                    <div class="sel-cat-name ${fontClass}">${catName}</div>
                    <div class="sel-items-list">`;

                // Regular item chips (removable via ×)
                checkedItems.forEach(item => {
                    const iName = (viewLang === 'gu' && item.gujarati_name) ? item.gujarati_name : item.name;
                    html += `<span class="sel-chip">
                        <span class="${fontClass}">${iName}</span>
                        <button onclick="removeItem(${item.id})" title="Remove">×</button>
                    </span>`;
                });

                // Custom item chips (edit textarea to remove)
                customLines.forEach(line => {
                    html += `<span class="sel-chip sel-chip-custom" title="Custom item">
                        <span>✏️ ${line}</span>
                    </span>`;
                });

                html += `</div></div>`;
            });

            if (totalVisible === 0) {
                preview.innerHTML = '<div class="sel-empty">No items selected yet</div>';
                if(clearBtn) clearBtn.style.display = 'none';
            } else {
                preview.innerHTML = html;
                if(clearBtn) clearBtn.style.display = 'inline';
            }
        }

        // --- 4. PDF GENERATION ---
        async function generatePDF(lang, isPreview) {
            let clientName, eventDate, guests, venue, phone;
            
            if (eventId) {
                clientName = currentEventData.title;
                eventDate = currentEventData.date;
                guests = document.getElementById('linked-guest-count').value || currentEventData.guests || 0;
                venue = currentEventData.venue;
                phone = currentEventData.contact_number;
            } else {
                clientName = document.getElementById('client-name').value;
                if(!clientName) { Swal.fire("Missing Info", "Please enter a Client Name", "warning"); return; }
                eventDate = document.getElementById('event-date').value;
                guests = document.getElementById('guest-count').value;
                venue = document.getElementById('venue-name').value;
                phone = document.getElementById('client-phone').value;
            }

            const note = document.getElementById('menu-note').value;

            // Build menu data
            const menuGroups = [];
            categories.forEach(cat => {
                const catItems = allItems.filter(i => i.category === cat.id && selectedItems.has(i.id));
                const customTextEl = document.getElementById(`custom-${cat.id}`);
                const customText = customTextEl ? customTextEl.value : "";
                const customLines = customText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if(catItems.length === 0 && customLines.length === 0) return;
                const catName = (lang === 'gu' && cat.gujarati_name) ? cat.gujarati_name : cat.name;
                const items = [
                    ...catItems.map(item => (lang === 'gu' && item.gujarati_name) ? item.gujarati_name : item.name),
                    ...customLines
                ];
                menuGroups.push({ catName, items });
            });

            await generatePDF_DM_HTML(clientName, eventDate, guests, venue, phone, note, menuGroups, lang, isPreview);
        }

        // --- HTML2CANVAS PDF for Direct Menu (MULTI-PAGE SUPPORT) ---
        async function generatePDF_DM_HTML(clientName, eventDate, guests, venue, phone, note, menuGroups, lang, isPreview) {
            const bgUrl = '{% static "images/background.png" %}';
            const coverUrl = '{% static "images/cover.png" %}';
            const backUrl = '{% static "images/last.png" %}';
            const fontFamily = "'Noto Sans Gujarati', sans-serif";

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            let firstPage = true;

            async function capturePageDiv(pageDiv) {
                document.body.appendChild(pageDiv);
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                await new Promise(r => setTimeout(r, 400));
                const canvas = await html2canvas(pageDiv, {
                    scale: 3, useCORS: true, allowTaint: true,
                    width: 794, height: 1123, logging: false,
                    backgroundColor: null
                });
                document.body.removeChild(pageDiv);
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                if (!firstPage) doc.addPage();
                doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                firstPage = false;
            }

            // --- Cover page ---
            const coverDiv = document.createElement('div');
            coverDiv.style.cssText = `position:fixed; left:-9999px; top:0; width:794px; height:1123px; background:white; background-image:url('${coverUrl}'); background-size:cover; background-position:center; font-family:${fontFamily}; overflow:hidden;`;
            coverDiv.innerHTML = `<div style="position:absolute; bottom:350px; width:100%; text-align:center; color:#D4AF37; font-size:28px; font-weight:700; font-family:${fontFamily};">${clientName} - ${formatDate(eventDate)}</div>`;
            await capturePageDiv(coverDiv);

            // --- Build all category blocks as individual elements ---
            const isGu = lang === 'gu';
            const allBlocks = [];

            menuGroups.forEach(group => {
                const catDiv = document.createElement('div');
                catDiv.style.cssText = 'break-inside: avoid; margin-bottom: 12px;';
                catDiv.innerHTML = `
                    <div style="background:#C6994F; color:#000; padding:6px 15px; border-radius:5px; font-weight:700; font-size:16px; margin-bottom:6px; font-family:${fontFamily};">${group.catName}</div>
                    ${group.items.map(name => `<div style="font-size:15px; padding:2px 15px; color:#1e1e1e; font-family:${fontFamily};">${name}</div>`).join('')}
                `;
                allBlocks.push(catDiv);
            });


            // --- Measure each block's height individually ---
            const blockHeights = [];
            const measureSingle = document.createElement('div');
            // 322px is approx width of one column: (794 - 120 (padding) - 30 (gap)) / 2
            measureSingle.style.cssText = `position:fixed; left:-9999px; top:0; width:322px; font-family:${fontFamily};`;
            document.body.appendChild(measureSingle);

            for (let i = 0; i < allBlocks.length; i++) {
                measureSingle.innerHTML = '';
                measureSingle.appendChild(allBlocks[i].cloneNode(true));
                await new Promise(r => setTimeout(r, 20)); // allow rendering
                // Add 12px for the margin-bottom we defined in block css
                blockHeights.push(measureSingle.scrollHeight + 12);
            }
            document.body.removeChild(measureSingle);

            // --- Split blocks ---
            const PAGE_CONTENT_HEIGHT = 650; // Reduced to leave room for note
            const CONTINUATION_TOP = 155; 
            const pages = [];
            let currentPageBlocks = { col1: [], col2: [] };
            let isFirstContentPage = true;
            
            let currentMaxHeight = PAGE_CONTENT_HEIGHT;
            let col1Height = 0;
            let col2Height = 0;

            for (let i = 0; i < allBlocks.length; i++) {
                let h = blockHeights[i];
                if (col1Height + h <= currentMaxHeight) {
                    col1Height += h;
                    currentPageBlocks.col1.push(allBlocks[i]);
                } else if (col2Height + h <= currentMaxHeight) {
                    col2Height += h;
                    currentPageBlocks.col2.push(allBlocks[i]);
                } else {
                    pages.push({ blocks: currentPageBlocks, isFirst: isFirstContentPage });
                    isFirstContentPage = false;
                    currentMaxHeight = 1123 - CONTINUATION_TOP - 100; // Leave room for note
                    currentPageBlocks = { col1: [allBlocks[i]], col2: [] };
                    col1Height = h;
                    col2Height = 0;
                }
            }
            if (currentPageBlocks.col1.length > 0 || currentPageBlocks.col2.length > 0) {
                pages.push({ blocks: currentPageBlocks, isFirst: isFirstContentPage });
            }

            // --- Render each page ---
            for (let p = 0; p < pages.length; p++) {
                const page = pages[p];
                const pageDiv = document.createElement('div');
                pageDiv.style.cssText = `position:fixed; left:-9999px; top:0; width:794px; height:1123px; background:white; background-image:url('${bgUrl}'); background-size:cover; background-position:center; font-family:${fontFamily}; overflow:hidden;`;

                if (page.isFirst) {
                    // First page has the header with client info
                    const header = document.createElement('div');
                    header.style.cssText = 'padding: 155px 60px 0 60px;';
                    header.innerHTML = `
                        <div style="border-top: 2px solid #D4AF37; border-bottom: 2px solid #D4AF37; padding: 12px 0; margin-bottom: 25px;">
                            <div style="display:flex; gap:10px; margin-bottom:6px; font-size:15px;">
                                <span style="color:#D4AF37; font-weight:700; min-width:65px;">${isGu ? 'નામ :' : 'Name :'}</span>
                                <span style="color:#000; font-weight:600; flex:1;">${clientName || "-"}</span>
                                <span style="color:#D4AF37; font-weight:700; min-width:65px;">${isGu ? 'વ્યક્તિ :' : 'Guests :'}</span>
                                <span style="color:#000; font-weight:600; flex:1;">${guests || "-"}</span>
                            </div>
                            <div style="display:flex; gap:10px; margin-bottom:6px; font-size:15px;">
                                <span style="color:#D4AF37; font-weight:700; min-width:65px;">${isGu ? 'તારીખ :' : 'Date :'}</span>
                                <span style="color:#000; font-weight:600; flex:1;">${formatDate(eventDate)}</span>
                                <span style="color:#D4AF37; font-weight:700; min-width:65px;">${isGu ? 'સ્થળ :' : 'Venue :'}</span>
                                <span style="color:#000; font-weight:600; flex:1;">${venue || "-"}</span>
                            </div>
                            ${phone ? `<div style="display:flex; gap:10px; font-size:15px;">
                                <span style="color:#D4AF37; font-weight:700; min-width:65px;">${isGu ? 'ફોન :' : 'Phone :'}</span>
                                <span style="color:#000; font-weight:600;">${phone}</span>
                            </div>` : ''}
                        </div>
                    `;
                    pageDiv.appendChild(header);
                } else {
                    // Continuation pages: just top padding + "continued" label
                    const contHeader = document.createElement('div');
                    contHeader.style.cssText = 'padding: 155px 60px 0 60px;';
                    contHeader.innerHTML = `<div style="text-align:center; color:#C6994F; font-size:13px; font-weight:600; margin-bottom:15px; font-family:${fontFamily};">${isGu ? '— આગળ ચાલુ —' : '— Menu Continued —'}</div>`;
                    pageDiv.appendChild(contHeader);
                }

                // Content area with Flexbox columns to prevent html2canvas overflow bugs
                const contentArea = document.createElement('div');
                const contentHeight = page.isFirst ? 650 : (1123 - CONTINUATION_TOP - 100);
                contentArea.style.cssText = `padding: 0 60px; display:flex; flex-direction:column; height: ${contentHeight}px;`;

                const columnsWrapper = document.createElement('div');
                columnsWrapper.style.cssText = `display:flex; gap:30px; align-items:flex-start; flex:1;`;
                
                const col1 = document.createElement('div');
                col1.style.cssText = `flex: 1; display:flex; flex-direction:column; gap:0; width: 322px; max-width: 322px;`;
                page.blocks.col1.forEach(b => col1.appendChild(b.cloneNode(true)));

                const col2 = document.createElement('div');
                col2.style.cssText = `flex: 1; display:flex; flex-direction:column; gap:0; width: 322px; max-width: 322px;`;
                page.blocks.col2.forEach(b => col2.appendChild(b.cloneNode(true)));

                columnsWrapper.appendChild(col1);
                columnsWrapper.appendChild(col2);
                contentArea.appendChild(columnsWrapper);

                if (p === pages.length - 1 && noteText) {
                    const noteDiv = document.createElement('div');
                    noteDiv.style.cssText = `margin-top:15px; background:#FFFCF5; border:1px solid #C6994F; border-radius:5px; overflow:hidden; width:100%; break-inside: avoid;`;
                    noteDiv.innerHTML = `
                        <div style="background:#C6994F; color:#fff; padding:5px 15px; font-weight:700; font-size:14px; text-align:center;">${isGu ? 'વિશેષ નોંધ' : 'SPECIAL NOTE'}</div>
                        <div style="padding:8px 15px; font-size:14px; font-family:${fontFamily};">${noteText}</div>
                    `;
                    contentArea.appendChild(noteDiv);
                }

                pageDiv.appendChild(contentArea);

                await capturePageDiv(pageDiv);
            }

            // --- Back cover ---
            const backDiv = document.createElement('div');
            backDiv.style.cssText = `position:fixed; left:-9999px; top:0; width:794px; height:1123px; background:white; background-image:url('${backUrl}'); background-size:cover; background-position:center;`;
            await capturePageDiv(backDiv);

            const customerName = clientName.replace(/[\\/:*?"<>|]/g, '').trim() || 'Menu';
            const filenameDate = formatDate(eventDate).slice(0, 5);
            const fName = `${customerName}-${filenameDate}-SC.pdf`;

            if(isPreview) window.open(doc.output('bloburl'), '_blank');
            else {
                doc.save(fName);
                logPdfGeneration(clientName, eventDate, guests, venue, phone, note, lang);
            }
        }

        // --- PDF log helper ---
        function logPdfGeneration(clientName, eventDate, guests, venue, phone, note, lang) {
            try {
                const itemNames = Array.from(selectedItems).map(id => {
                    const item = allItems.find(x => x.id === id);
                    return item ? item.name : '';
                }).filter(Boolean).join(', ');

                const detailsString = `Menu PDF Generated\n---\nClient: ${clientName || 'Direct Menu'}\nDate: ${eventDate}\nGuests: ${guests}\nVenue: ${venue || '-'}\nPhone: ${phone || '-'}\n\nSelected Items: ${itemNames}\nNote: ${note || '-'}\nLanguage: ${lang === 'gu' ? 'Gujarati' : 'English'}`;

                fetch('/api/log-pdf/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ event_details: detailsString })
                });
            } catch(e) { console.log('PDF Log notify:', e); }
        }

        // --- 5. SAVE TO DB ---
        async function saveToDatabase() {
            if(!eventId) return; 
            
            // Collect custom items from all category textareas
            const customItemsData = {};
            categories.forEach(cat => {
                const textarea = document.getElementById(`custom-${cat.id}`);
                if (textarea && textarea.value.trim()) {
                    const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    if (lines.length > 0) {
                        customItemsData[cat.id] = lines;
                    }
                }
            });
            
            const guestCount = eventId ? (parseInt(document.getElementById('linked-guest-count').value) || 0) : (parseInt(document.getElementById('guest-count').value) || 0);
            const payload = {
                event: eventId,
                title: "Menu " + new Date().toLocaleDateString(),
                guest_count: guestCount,
                items: Array.from(selectedItems),
                note: document.getElementById('menu-note').value,
                custom_items_text: JSON.stringify(customItemsData),
                is_selected: true,
                created_by: window.currentUsername || ''
            };

            const url = menuId ? `/api/menu/menus/${menuId}/` : `/api/menu/menus/`;
            const method = menuId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 
                        'Authorization': `Token ${token}`,
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(payload)
                });

                if(res.ok) {
                    Swal.fire("Saved", "Menu saved successfully!", "success")
                        .then(() => window.location.href = "{% url 'dashboard' %}");
                } else {
                    throw new Error("Save failed");
                }
            } catch(e) { Swal.fire("Error", "Could not save menu.", "error"); }
        }

        function formatDate(d) {
            if(!d) return "";
            try { const p=d.split('-'); return `${p[2]}-${p[1]}-${p[0]}`; } catch(e) { return d; }
        }

        init();
    </script>
</body>
